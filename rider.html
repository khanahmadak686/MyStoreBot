<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛵 Rider Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .order-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; border-left: 5px solid #f39c12; }
        .order-card h3 { margin: 0 0 10px 0; color: #333; }
        .order-card p { margin: 5px 0; color: #555; line-height: 1.4; }
        .btn-deliver { display: block; width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn-deliver:hover { background: #2ecc71; }
        .cash-badge { background: #e74c3c; color: white; padding: 3px 8px; border-radius: 3px; font-size: 12px; font-weight: bold; }
        .upi-badge { background: #2980b9; color: white; padding: 3px 8px; border-radius: 3px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🛵 Active Deliveries</h2>
        <p>Orders ready to be delivered</p>
    </div>

    <div id="orders-container">
        <p style="text-align:center;">Loading orders...</p>
    </div>

    <script>
        async function fetchOrders() {
            const res = await fetch('/api/rider-orders');
            const orders = await res.json();
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if(orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">No active deliveries right now. 🎉</p>';
                return;
            }

            orders.forEach(order => {
                let badge = order.payment_mode === 'Cash' 
                    ? `<span class="cash-badge">Collect ₹${order.total} Cash</span>` 
                    : `<span class="upi-badge">UPI Paid (No Cash)</span>`;

                let card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <h3>Order ID: ${order.id}</h3>
                    <p><b>📍 Address & Contact:</b><br>${order.customer_details}</p>
                    <p><b>📦 Items Total:</b> ₹${order.total}</p>
                    <p>${badge}</p>
                    <button class="btn-deliver" onclick="markDelivered('${order.id}')">✅ Mark as Delivered</button>
                `;
                container.appendChild(card);
            });
        }

        async function markDelivered(orderId) {
            if(confirm("Are you sure this order is delivered to the customer?")) {
                await fetch(`/api/mark-delivered/${orderId}`, { method: 'POST' });
                alert("Order marked as delivered!");
                fetchOrders(); // Refresh the list
            }
        }

        // Load orders immediately
        fetchOrders();
    </script>
</body>
</html>
