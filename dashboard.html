<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin Dashboard</title>
    <style>
        :root {
            --primary-color: #28a745;
            --primary-hover: #218838;
            --secondary-color: #007bff;
            --secondary-hover: #0056b3;
            --bg-color: #f4f4f9;
            --text-color: #333;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: var(--text-color);
        }

        /* Login Overlay Styles */
        #loginOverlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #2c3e50; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }
        .login-box { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 10px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 320px; 
        }
        .login-box input { margin-top: 20px; text-align: center;}
        .login-box button { background-color: #e74c3c; margin-top: 20px; margin-bottom: 0;}
        .login-box button:hover { background-color: #c0392b; }

        /* Dashboard Container Styles */
        .container { 
            max-width: 500px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        
        /* Form Elements */
        label { font-weight: 600; font-size: 14px; margin-top: 15px; display: block; }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0 15px 0; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        /* Buttons */
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-bottom: 20px; 
            transition: background-color 0.3s;
        }
        button:hover { background-color: var(--primary-hover); }
        
        .broadcast-btn { background-color: var(--secondary-color); }
        .broadcast-btn:hover { background-color: var(--secondary-hover); }
        
        .download-btn { 
            background-color: #ff9800; 
            color: white; 
            text-decoration: none; 
            display: block; 
            text-align: center; 
            border-radius: 6px; 
            padding: 12px; 
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .download-btn:hover { background-color: #e68a00; }
        
        hr { border: 0; border-top: 1px solid #eee; margin: 30px 0; }
        h2 { margin-top: 0; color: #2c3e50; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔒 Admin Login</h2>
            <p>Please enter your password to continue</p>
            <input type="password" id="adminPwd" placeholder="Password">
            <button onclick="checkPwd()">Login to Dashboard</button>
        </div>
    </div>

    <main class="container">
        
        <section>
            <h2>🛒 Add New Product</h2>
            <form action="/add-product" method="POST">
                <label for="productName">Product Name:</label>
                <input type="text" id="productName" name="name" placeholder="E.g., Whole Wheat Flour" required>
                
                <label for="category">Category:</label>
                <select id="category" name="category" required>
                    <option value="Groceries & Spices">Groceries & Spices</option>
                    <option value="Snacks & Beverages">Snacks & Beverages</option>
                    <option value="Cleaning & Household">Cleaning & Household</option>
                    <option value="Others">Others</option>
                </select>
                
                <label for="unit">Weight / Quantity (Unit):</label>
                <input type="text" id="unit" name="unit" placeholder="E.g., 1 kg, 500 ml" required>
                
                <label for="price">Price (in ₹):</label>
                <input type="number" id="price" name="price" placeholder="E.g., 250" required>
                
                <label for="stock">Total Stock (Available Quantity):</label>
                <input type="number" id="stock" name="stock" placeholder="E.g., 50" required>
                
                <label for="image">Product Image Link (URL):</label>
                <input type="url" id="image" name="image" placeholder="https://example.com/image.jpg" required>
                
                <button type="submit">Upload Product</button>
            </form>
        </section>

        <hr>
        
        <section>
            <h2>📢 Broadcast Offer</h2>
            <form action="/broadcast" method="POST">
                <label for="broadcastMsg" style="display:none;">Message</label>
                <textarea id="broadcastMsg" name="message" rows="4" placeholder="E.g., Special Offer! Flat 20% off on all items today!..." required></textarea>
                <button type="submit" class="broadcast-btn">Send to All Customers 🚀</button>
            </form>
        </section>

        <hr>
        
        <section>
            <h2>📊 Store Reports</h2>
            <a href="/download-sales" target="_blank" class="download-btn">📥 Download Sales Report (Excel)</a>
        </section>

    </main>

    <script>
        // Password Check Logic
        function checkPwd() {
            const pwd = document.getElementById('adminPwd').value;
            if(pwd === 'admin123') {
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                alert('❌ Wrong Password! Access Denied.');
            }
        }

        // Allow pressing "Enter" to login
        document.getElementById('adminPwd').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPwd();
            }
        });
    </script>
</body>
</html>
